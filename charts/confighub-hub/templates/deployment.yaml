apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "confighub-hub.fullname" . }}
  labels:
    {{- include "confighub-hub.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "confighub-hub.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "confighub-hub.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: hub
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            {{- if .Values.oidc.issuer }}
            - name: CONFIGHUB_AUTH_ISSUER
              value: {{ .Values.oidc.issuer | quote }}
            {{- end }}
            {{- if .Values.oidc.audience }}
            - name: CONFIGHUB_TOKEN_EXCHANGE_AUDIENCE
              value: {{ .Values.oidc.audience | quote }}
            {{- end }}
            {{- if .Values.oidc.jwksUrl }}
            - name: CONFIGHUB_AUTH_JWKS_URL
              value: {{ .Values.oidc.jwksUrl | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/confighub
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "confighub-hub.fullname" . }}-data
      {{- end }}
