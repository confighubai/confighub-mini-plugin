name: Configuration review
description: >-
  On a pull request, comment with each configuration value it changes, from what
  to what, and why where a record says: the record the ConfigHub plugin keeps of
  what agents change. Needs no hub and no account.
branding:
  icon: list
  color: blue
inputs:
  base:
    description: The commit to compare from. Default, the pull request's base.
    required: false
    default: ""
  comment:
    description: Post the review as a comment on the pull request, updated in place on each run.
    required: false
    default: "true"
  github-token:
    description: A token that may comment on pull requests.
    required: false
    default: ${{ github.token }}
  hub-url:
    description: Optional URL of a self-hosted or hosted ConfigHub hub to record each pull request review in. Leave empty to send nothing to any hub.
    required: false
    default: ""
  hub-space:
    description: Optional ConfigHub Space to record PullRequestReview attestations in (required when hub-url is set).
    required: false
    default: ""
  hub-token:
    description: Optional scoped ConfigHub service account token for recording pull request reviews (required when hub-url is set).
    required: false
    default: ""
outputs:
  review:
    description: The review, as Markdown.
    value: ${{ steps.review.outputs.review }}
runs:
  using: composite
  steps:
    - id: review
      shell: bash
      env:
        BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail
        if [ -z "$BASE" ]; then echo "No base commit: run this on a pull request, or give base." >&2; exit 1; fi
        git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null || true
        "$GITHUB_ACTION_PATH/../plugins/confighub/bin/confighub" mini review --base "$BASE" --head HEAD --markdown > "$RUNNER_TEMP/review.md"
        cat "$RUNNER_TEMP/review.md" >> "$GITHUB_STEP_SUMMARY"
        { echo "review<<CUB_MINI_REVIEW_END"; cat "$RUNNER_TEMP/review.md"; echo "CUB_MINI_REVIEW_END"; } >> "$GITHUB_OUTPUT"
    - if: inputs.comment == 'true' && github.event.pull_request.number
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        marker="<!-- confighub-mini configuration review -->"
        body="$(printf '%s\n%s' "$marker" "$(cat "$RUNNER_TEMP/review.md")")"
        id="$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | tail -1)"
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" >/dev/null
        else
          gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$body" >/dev/null
        fi
    - if: inputs.hub-url != '' && inputs.hub-space != '' && inputs.hub-token != '' && github.event.pull_request.number
      shell: bash
      env:
        BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
        HEAD: ${{ github.event.pull_request.head.sha }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        AUTHOR: ${{ github.event.pull_request.user.login }}
        GH_TOKEN: ${{ inputs.github-token }}
        HUB_URL: ${{ inputs.hub-url }}
        HUB_SPACE: ${{ inputs.hub-space }}
        CUB_TOKEN: ${{ inputs.hub-token }}
      run: |
        set -euo pipefail
        approvers="$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate --jq '[.[] | select(.state=="APPROVED") | .user.login] | unique | join(",")' 2>/dev/null || true)"
        export CUB_CONFIG="$RUNNER_TEMP/cub-config"
        export CUB_CONTEXT="pr-recorder"
        cub context create "$CUB_CONTEXT" --server "$HUB_URL" >/dev/null 2>&1 || true
        "$GITHUB_ACTION_PATH/../plugins/confighub/bin/confighub" mini record-pr \
          --space "$HUB_SPACE" \
          --repo "$REPO" \
          --pr "$PR" \
          --base "$BASE" \
          --head "$HEAD" \
          --author "$AUTHOR" \
          --approved-by "$approvers"
