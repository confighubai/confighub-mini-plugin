# An agent in CI that changes your configuration through a ConfigHub hub of
# its own, and hands the result back as a pull request. Copy to
# .github/workflows/ and run it from the Actions tab with a task.
#
# The repository keeps the configuration as a hub file (HUB_FILE), written by
# "cub mini copy COMPONENT --to-file", and as the plain files Argo CD or Flux
# deploy (DEPLOY_DIR), written by "cub mini copy COMPONENT --to-dir". The job
# starts a confighub mini from the file, the agent makes its change there, and
# the job writes both back. The pull request shows every value that changed,
# and DEPLOY_DIR/CHANGES.md says why each value is set; values set in one
# environment for a reason are kept.
#
# Needs the secret ANTHROPIC_API_KEY. For the job to open the pull request
# itself, turn on "Allow GitHub Actions to create and approve pull requests" in
# the repository's Actions settings; without it, the job pushes the branch and
# its summary links to the pull request to open.
name: Agent task
on:
  workflow_dispatch:
    inputs:
      task:
        description: What the agent should do
        required: true
permissions:
  contents: write
  pull-requests: write
env:
  COMPONENT: shop
  HUB_FILE: ci/shop/shop.tar.gz
  DEPLOY_DIR: ci/shop/deploy
  PLUGIN: v0.52.0
  MINI: 0.9.0-mini.4
  CLAUDE_CODE: 2.1.285
jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Claude Code, the plugin and confighub mini
        run: |
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE"
          # Outside the checkout, so that nothing of it is committed.
          git clone -q --depth 1 --branch "$PLUGIN" https://github.com/confighubai/confighub-mini-plugin "$RUNNER_TEMP/plugin"
          cd "$RUNNER_TEMP"
          P=linux-$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')
          base=https://github.com/confighubai/confighub-mini-plugin/releases/download/mini-v$MINI
          curl -fsSLO "$base/confighub-mini-$MINI-$P.tar.xz"
          curl -fsSLO "$base/SHA256SUMS"
          grep " confighub-mini-$MINI-$P.tar.xz" SHA256SUMS | sha256sum -c
          tar xf "confighub-mini-$MINI-$P.tar.xz"
          mv "confighub-mini-$MINI-$P" confighub-mini
          confighub-mini/bin/cub plugin install ./confighub-mini >/dev/null
          echo "$HOME/.confighub/plugins/confighub-mini/bin" >> "$GITHUB_PATH"
      - name: A hub of its own, from the repository's hub file
        run: cub mini copy --from-file "$HUB_FILE"
      - name: The agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TASK: ${{ inputs.task }}
        run: |
          claude -p "This is a CI job, and nobody can answer questions. The configuration of $COMPONENT is in a ConfigHub hub here, used with cub: $COMPONENT-base is what every environment starts from, and each environment is a copy of it, such as $COMPONENT-prod. Make your change in the hub, not in the files: change the base with cub function set --space $COMPONENT-base --unit UNIT --change-desc WHY FUNCTION ARGS (cub function list lists the functions; cub unit list --space SPACE lists the units), or one environment with cub mini set $COMPONENT ... --variant ENV --change-desc WHY. See what an environment would take from the base with cub mini promote $COMPONENT-ENV --dry-run, and take it with cub mini promote $COMPONENT-ENV --change-desc WHY. A value an environment keeps was set there for a reason, which the dry run and $DEPLOY_DIR/CHANGES.md give; leave it unless the task says otherwise. Do not edit the files under $DEPLOY_DIR or commit: the job writes them from the hub when you are done. Finish with a short summary of what you changed and why. The task: $TASK" \
            --plugin-dir "$RUNNER_TEMP/plugin/plugins/confighub" --strict-mcp-config --permission-mode acceptEdits \
            --allowedTools Read "Bash(cub:*)" "Bash(ls:*)" "Bash(cat:*)" > "$RUNNER_TEMP/answer.md"
          cat "$RUNNER_TEMP/answer.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Written back from the hub
        run: |
          cub mini copy "$COMPONENT" --to-dir "$RUNNER_TEMP/out"
          rsync -a --delete "$RUNNER_TEMP/out/" "$DEPLOY_DIR/"
          cub mini copy "$COMPONENT" --to-file "$RUNNER_TEMP/hub.tar.gz"
          cp "$RUNNER_TEMP/hub.tar.gz" "$HUB_FILE"
      - name: The pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ inputs.task }}
        run: |
          if git diff --quiet -- "$DEPLOY_DIR"; then echo "Nothing changed in $DEPLOY_DIR." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          git config user.name "Agent task"
          git config user.email "agent-task@users.noreply.github.com"
          git switch -c "agent/$GITHUB_RUN_ID"
          git add -A "$DEPLOY_DIR" "$HUB_FILE"
          git commit -q -F - <<MSG
          Agent: ${TASK:0:60}

          $(cat "$RUNNER_TEMP/answer.md")
          MSG
          git push -q -u origin HEAD
          if ! gh pr create --base "$GITHUB_REF_NAME" --title "Agent: ${TASK:0:60}" --body-file "$RUNNER_TEMP/answer.md"; then
            echo "Open the pull request: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$GITHUB_REF_NAME...agent/$GITHUB_RUN_ID?expand=1" >> "$GITHUB_STEP_SUMMARY"
          fi
